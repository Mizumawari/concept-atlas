[[relations]]
type = "model"
shape = "star"
title = "深層筋膜の収束と拡散（呼吸・自律神経・寒冷・覚醒）"
desc = "2026年10月の note 群。深層筋膜の収束と拡散を、呼吸とは別の身体内部の動きとして扱い、サウナ・冷水やヴィム・ホフとの比較、周天とも結びつける。SRC_276 では、頭部の充実感を会陰へ移して頭側を「虚圧化」させ、眠気を切り替える操作と、脳脊髄液の「余白」仮説に展開している。"
