# Notebook 概念アトラス（みずまわり）の設定。汎用エンジン concept-atlas の実例。
title = "Notebook 概念アトラス"
input = "corpus"
output = "dist"
id_pattern = "SRC_\\d{3}"
primary_category = "一次資料"
html_mode = "app"
summaries = "summaries.tsv"
root_label = "（Notebook 直下）"

[ext_categories]
".py" = "解析スクリプト"
".js" = "解析スクリプト"
".json" = "解析データ"
".txt" = "解析データ"
".md" = "解析データ"

[catalog]
file = "catalog.tsv"
label = "note"

[title_overrides]
SRC_150 = "夢の記憶は「夢見モード」でないと思い出せないのか（対話）"

