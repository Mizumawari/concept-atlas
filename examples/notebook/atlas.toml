[[relations]]
type = "same"
shape = "ring"
title = "DMNの沈静化 ＝「俺フィルター」の解除 ＝ PNSE的状態"
desc = "神経層のDMN低下は、主観では「自分がどう思うか」という自己物語が差し込まれない状態として現れ、それが続いた結果がPNSEと呼ばれる状態になる。"
src = "research_corpus/00_indexes/RELATIONSHIPS.md"
nodes = ["DMN", "俺フィルター", "PNSE", "自己物語・自己感"]

[[relations]]
type = "same"
shape = "ring"
title = "前面の力み・構え ＝ 予測誤差の立ち上がり ＝ 不安"
desc = "不安は単独では存在せず、身体前面への意識の偏りや力みと常にセットになっている。心理の問題を身体のベクトルとして説明する。"
src = "research_corpus/00_indexes/RELATIONSHIPS.md"
nodes = ["前面／後面モデル", "緊張・力み", "予測・予測誤差", "不安"]

[[relations]]
type = "same"
shape = "ring"
title = "低カロリー・血糖安定 ＝ RASの過剰駆動の抑制"
desc = "糖質のスパイクがRASを強制的に立ち上げるため、代謝をフラットにすることが「精神的な静寂」の基盤をハードウェア側で支える。"
src = "research_corpus/00_indexes/RELATIONSHIPS.md"
nodes = ["代謝・血糖・食事", "RAS", "静寂・基底状態"]

[[relations]]
type = "dev"
shape = "chain"
title = "内部緊張の解除 →「常態」としての静寂基底"
desc = "姿勢・重心・腹圧の調整で身体の微細なノイズを消す技術を得たことで、行為に依存しない静寂（PNSE）の常態化へつながった。"
src = "research_corpus/00_indexes/RELATIONSHIPS.md"
nodes = ["緊張・力み", "姿勢・重心", "腹部・腹圧", "静寂・基底状態", "PNSE"]

[[relations]]
type = "dev"
shape = "chain"
title = "行為への没入（フロー）→ 状態から常態（OS）への移行"
desc = "長距離ドライブなどの没入でDMNを抑える段階から、行為をやめても戻らない「常態」の書き換えを重視する段階へ移った。"
src = "research_corpus/00_indexes/TIMELINE.md"
nodes = ["フロー・没入", "身体操作", "静寂・基底状態"]

[[relations]]
type = "dev"
shape = "fan"
title = "神経基底モデル → 宗教・ADHD・倫理・AIの再解釈"
desc = "DMN/RASの静寂化というモデルを外に応用し、悟り・独覚、ADHDや薬の作用、倫理とAIの学習までを「神経モデルのパラメータの違い」として説明し直す。"
src = "research_corpus/00_indexes/RELATIONSHIPS.md"
nodes = ["DMN", "RAS", "悟り・覚者", "仏教・東洋思想", "ADHD・薬理", "倫理", "AI"]

[[relations]]
type = "res"
shape = "res"
title = "フロー と PNSE：どちらも自己が消えるが構造が違う"
desc = "フローはRASを高めてDMNを強制的に遮断する高エネルギー状態。PNSEはRASもDMNもベースラインが下がった低コスト状態。段階的な移行として統合される。"
src = "research_corpus/00_indexes/RELATIONSHIPS.md"
nodes = ["フロー・没入", "PNSE", "RAS", "DMN"]

[[relations]]
type = "res"
shape = "res"
title = "瞑想（心理的介入）と 身体の張力解除（身体的介入）"
desc = "心を心で整える介入は評価と自己監視を伴いDMNを駆動させる。身体の張力を物理的に解く介入は物語を伴わずRASのゲインを下げる。レイヤーの違いで矛盾が解ける。"
src = "research_corpus/00_indexes/RELATIONSHIPS.md"
nodes = ["瞑想・マインドフルネス", "身体操作", "DMN", "ゲイン"]

